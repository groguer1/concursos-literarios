name: Actualizar concursos literarios

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar paginas de concursos
        run: |
          curl -s -L --max-time 30 -A "Mozilla/5.0" "https://www.escritores.org/concursos/concursos-1/concursos-literarios" > /tmp/fuente1.html || echo "" > /tmp/fuente1.html
          curl -s -L --max-time 30 -A "Mozilla/5.0" "https://www.guiadeconcursos.com/" > /tmp/fuente2.html || echo "" > /tmp/fuente2.html
          echo "Fuente1: $(wc -c < /tmp/fuente1.html) bytes"
          echo "Fuente2: $(wc -c < /tmp/fuente2.html) bytes"

      - name: Buscar concursos con IA
        timeout-minutes: 10
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
        run: node scripts/buscar-concursos.js

      - name: Guardar cambios si hay concursos nuevos
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 'git add index.html' se quedo corto el 10/09: el bot escribe ademas
          # concursos-relato-corto.html y concursos-poesia.html, esas quedaban sin
          # preparar y 'git pull --rebase' se plantaba con "You have unstaged changes",
          # asi que el push NO se hacia y el listado no se publicaba. El runner parte de
          # un checkout limpio, o sea que lo unico modificado es lo que escribe el bot:
          # con -A no vuelve a caducar cuando el bot escriba una pagina mas.
          git add -A
          git diff --staged --quiet || git commit -m "Actualizacion automatica de concursos $(date +'%d/%m/%Y')"
          git pull --rebase origin main
          git push
